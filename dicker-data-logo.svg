<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="#1a1a1a"/>
  
  <!-- Dicker Data Official Style Logo -->
  <defs>
    <style>
      .dicker-text { 
        font-family: 'Arial', sans-serif; 
        font-weight: bold; 
      }
    </style>
  </defs>
  
  <!-- White text matching official branding -->
  <text x="100" y="27" class="dicker-text" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.25em">DICKER</text>
  <text x="100" y="45" class="dicker-text" font-size="12" fill="#CCCCCC" text-anchor="middle" letter-spacing="0.35em">DATA</text>
</svg>
