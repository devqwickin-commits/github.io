    <rect x="15" y="15" width="13" height="13" fill="#FFB900"/>
  </g>
  
  <!-- Microsoft Text -->
  <text x="60" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#5E5E5E">Microsoft</text>
  <text x="60" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#737373">Partner</text>
